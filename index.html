  <style>
    /* 🪷 信仰主題系統：data-faith 驅動 */
    :root {
      --faith-accent: #f59e0b;
      --faith-accent-rgb: 245, 158, 11;
      --faith-accent-light: #fbbf24;
      --faith-accent-dark: #d97706;
    }
    [data-faith="buddhist"] {
      --faith-accent: #f0a6c0;
      --faith-accent-rgb: 240, 166, 192;
      --faith-accent-light: #f9c6d8;
      --faith-accent-dark: #d97a9e;
    }
    /* 佛教：amber 系全部轉蓮粉 */
    [data-faith="buddhist"] .text-amber-500 { color: #f0a6c0 !important; }
    [data-faith="buddhist"] .text-amber-400 { color: #f9c6d8 !important; }
    [data-faith="buddhist"] .text-amber-600 { color: #d97a9e !important; }
    [data-faith="buddhist"] .bg-amber-500 { background-color: #f0a6c0 !important; }
    [data-faith="buddhist"] .bg-amber-600 { background-color: #d97a9e !important; }
    [data-faith="buddhist"] .border-amber-500 { border-color: #f0a6c0 !important; }
    [data-faith="buddhist"] .from-amber-600\/10 { --tw-gradient-from: rgb(240 166 192 / 0.1) !important; }
    [data-faith="buddhist"] .via-amber-900\/5 { --tw-gradient-to: rgb(240 166 192 / 0.05) !important; }
    [data-faith="buddhist"] .bg-amber-900\/10 { background-color: rgba(240, 166, 192, 0.1) !important; }
    [data-faith="buddhist"] .bg-amber-900\/20 { background-color: rgba(240, 166, 192, 0.15) !important; }
    [data-faith="buddhist"] .border-amber-500\/10 { border-color: rgba(240, 166, 192, 0.1) !important; }
    [data-faith="buddhist"] .border-amber-500\/30 { border-color: rgba(240, 166, 192, 0.3) !important; }
    [data-faith="buddhist"] .text-amber-200 { color: #fbd3e3 !important; }
    [data-faith="buddhist"] .text-amber-600\/70 { color: rgba(217, 122, 158, 0.7) !important; }
    [data-faith="buddhist"] .text-amber-500\/60 { color: rgba(240, 166, 192, 0.6) !important; }
    [data-faith="buddhist"] .text-amber-500\/40 { color: rgba(240, 166, 192, 0.4) !important; }
    [data-faith="buddhist"] .text-amber-500\/50 { color: rgba(240, 166, 192, 0.5) !important; }
    [data-faith="buddhist"] .text-amber-500\/90 { color: rgba(240, 166, 192, 0.9) !important; }
    /* 佛教：晨霧背景 */
    [data-faith="buddhist"] .faith-mist {
      background: radial-gradient(ellipse at 50% 30%, rgba(240,166,192,0.08), transparent 60%),
                  radial-gradient(ellipse at 30% 70%, rgba(45,212,191,0.05), transparent 50%) !important;
    }
    * {
      font-family: 'Noto Sans TC', sans-serif;
    }

    .font-serif {
      font-family: 'Noto Serif TC', serif;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fade-in 1s ease-out;
    }

    @keyframes dash {
      0% {
        transform: translateX(0) translateY(0);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateX(-400px) translateY(400px);
        opacity: 0;
      }
    }

    /* 🛡️ Obsidian Truth Glitch Effect */
    @keyframes glitch {
      0% {
        transform: translate(0) scale(1);
        text-shadow: -2px 0 #06b6d4, 2px 0 #ec4899;
      }

      20% {
        transform: translate(-1px, 1px) scale(1);
      }

      40% {
        transform: translate(-1px, -1px) scale(0.999);
        text-shadow: 2px 0 #06b6d4, -2px 0 #ec4899;
      }

      60% {
        transform: translate(1px, 1px) scale(1);
      }

      80% {
        transform: translate(1px, -1px) scale(1.001);
        text-shadow: -1px 0 #06b6d4, 1px 0 #ec4899;
      }

      100% {
        transform: translate(0) scale(1);
        text-shadow: none;
      }
    }

    .glitch-text {
      animation: glitch 3s infinite;
    }

    /* Premium Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.2);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(245, 158, 11, 0.4);
    }
  </style>
